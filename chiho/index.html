 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(DATA.iv)},k,b(DATA.ct)))}
function show(html){document.open();document.write(html);document.close()}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value.trim();document.getElementById('e').textContent='確認しています…';
 try{const h=await dec(pw);try{sessionStorage.setItem(KEY,pw)}catch(_){};show(h)}catch(_){document.getElementById('e').textContent='パスワードが違います (本日の分か確かめてください)'}};
(async()=>{let s=null;try{s=sessionStorage.getItem(KEY)}catch(_){};if(s){try{show(await dec(s))}catch(_){}}})();
</script></body></html>
